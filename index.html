<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מערכת ניתוח שיווק תיירות</title>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind (no-build, JIT runtime) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + Chart.js -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Chart.js (UMD build works directly via <script>, no bundler needed) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<!-- Supabase client (UMD build) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  html, body, #root { height: 100%; }
  body { font-family: 'Heebo', 'Segoe UI', Arial, sans-serif; margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<!-- 
  IMPORTANT: config.js must be loaded BEFORE app.js.
  It contains the Supabase project URL + anon (public) key.
  The anon key is SAFE to expose in client-side code — that's how Supabase
  is designed to work. Security is enforced by Row Level Security (RLS)
  policies on the database side, not by hiding this key.
  NEVER put the Gemini API key here — that one lives only inside the
  Supabase Edge Function as a server-side secret.
-->
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
